name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: Jonathan1612/container-apps/.github/workflows/deploy-app.yml@dev
    with:
      app_name: jacm-carpinteria
      branch: main
      frontend_domain: carpinteria.jacm.com.mx
      jwt_required: false
      mongo_required: false
      auth_secret_required: true
    secrets: inherit